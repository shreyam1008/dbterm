name: Website

on:
  # Release owns the first gh-pages write (APT metadata and, for a new
  # version, the GitHub release itself). Publish the matching site only after
  # that workflow succeeds, so download links can never lead the binaries.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dbterm-publish-main
  cancel-in-progress: false

jobs:
  deploy-site:
    name: Build and Publish Site
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify advertised release exists
        shell: bash
        run: |
          set -euo pipefail
          LINE="$(grep -Ev '^[[:space:]]*#|^[[:space:]]*$' cmd/dbterm/releases.txt | head -n1 || true)"
          VERSION="$(printf '%s' "$LINE" | cut -d'|' -f1 | xargs)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not resolve the advertised version from cmd/dbterm/releases.txt" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Refusing to publish a website that advertises missing release v${VERSION}. Run the Release workflow first." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: site
        run: bun ci

      - name: Build static site
        working-directory: site
        env:
          PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          PUBLIC_REPOSITORY_NAME: ${{ github.event.repository.name }}
          PUBLIC_BASE_PATH: /
          PUBLIC_SITE_URL: https://dbterm.shreyam1008.com.np/
        run: bun run verify

      - name: Publish to gh-pages (preserve apt/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PAGES_DIR="/tmp/dbterm-gh-pages-site"

          rm -rf "$PAGES_DIR"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" "$PAGES_DIR"
          else
            git clone --depth 1 "$REPO_URL" "$PAGES_DIR"
            cd "$PAGES_DIR"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cd - >/dev/null
          fi

          rsync -av --delete \
            --exclude 'apt/' \
            --exclude '.git/' \
            --exclude 'CNAME' \
            site/dist/ "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"

          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No website changes to publish."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          git commit -m "site: publish ${SHORT_SHA}"

          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "Site published to gh-pages."
              exit 0
            fi

            echo "Push failed, rebasing and retrying (${attempt}/3)..."
            git pull --rebase origin gh-pages
          done

          echo "Failed to push site after retries."
          exit 1
